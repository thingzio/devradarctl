version: 2

project_name: devradarctl

before:
  hooks:
    # Verify modules are tidy without mutating go.mod/go.sum mid-release (which
    # would undermine a reproducible build). Fails the release if they drift —
    # run `go mod tidy` and commit before tagging.
    - go mod tidy -diff

builds:
  - id: devradarctl
    binary: devradarctl
    dir: .
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    mod_timestamp: "{{ .CommitTimestamp }}"
    ldflags:
      - -s -w
        -X main.version={{.Version}}
        -X main.commit={{.ShortCommit}}
        -X main.date={{.CommitDate}}
    goos:
      - linux
      - darwin
    goarch:
      - amd64
      - arm64

archives:
  - id: devradarctl
    formats: [tar.gz]
    name_template: "{{ .Binary }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    files:
      - LICENSE
      - README.md

# Named checksums.txt, not <project>_checksums.txt. The shared release workflow
# normalises whatever it finds to checksums.txt before signing it and publishes
# the signature as checksums.txt.bundle, so any other name leaves the release
# carrying a signature whose filename does not match the file it covers --
# which every consumer then has to be told about.
checksum:
  name_template: 'checksums.txt'
  algorithm: sha256

# Per-binary SBOMs of the released artifacts (requires syft on the release host).
sboms:
  - id: archive
    artifacts: archive

release:
  github:
    owner: thingzio
    name: devradarctl
  prerelease: auto
  # Draft, because the shared release workflow creates the release before it
  # signs it. It stays invisible until the signature has been verified, and the
  # workflow's publish job flips this. Previously false, which published the
  # binaries the moment they were built.
  draft: true
  # GitHub does not return drafts when looking a release up by tag, so without
  # this a re-run after a partial failure cannot see the draft it made last
  # time and opens a second one for the same tag.
  use_existing_draft: true

# Homebrew tap (cask). Publishes into the shared org-wide tap
# thingzio/homebrew-tap, so users install via `brew install thingzio/tap/devradarctl`.
# Guarded by HOMEBREW_DEPLOY_KEY: skip_upload is templated on the key so the cask
# is neither uploaded nor probed (no tap API call) when the key is absent —
# avoiding a failed cross-repo push. It activates once the release workflow
# provides HOMEBREW_DEPLOY_KEY (a fine-grained PAT with contents:write on
# homebrew-tap). 'auto' additionally skips prereleases even when the key is present.
homebrew_casks:
  - name: devradarctl
    repository:
      owner: thingzio
      name: homebrew-tap
      token: '{{ .Env.HOMEBREW_DEPLOY_KEY }}'
    homepage: https://github.com/thingzio/devradarctl
    description: CLI to generate and submit SBOMs to DevRadar
    skip_upload: '{{ if index .Env "HOMEBREW_DEPLOY_KEY" }}auto{{ else }}true{{ end }}'
    caveats: |
      devradarctl generates SBOMs with syft, which is not bundled.
      Install it separately: brew install syft
    # Binaries are not notarized; strip the macOS quarantine flag on install so
    # Gatekeeper doesn't block the CLI.
    hooks:
      post:
        install: |
          if OS.mac?
            system_command "/usr/bin/xattr", args: ["-dr", "com.apple.quarantine", "#{staged_path}/devradarctl"]
          end

report_sizes: true

snapshot:
  version_template: "{{ .Tag }}-next"

changelog:
  sort: asc
  groups:
    - title: Features
      regexp: '^.*?feat(\([[:word:]]+\))??!?:.+$'
      order: 0
    - title: Bug Fixes
      regexp: '^.*?fix(\([[:word:]]+\))??!?:.+$'
      order: 1
    - title: Other
      order: 999
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"
      - "^ci:"
      - typo
