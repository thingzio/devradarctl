name: qualify

# Reusable quality gate: format check, vet, lint, and the test suite with
# coverage enforcement. Called by the push/PR `test` workflow and the tagged
# `release` workflow, so a release re-qualifies from scratch rather than
# trusting that main was green.
on:
  workflow_call:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache-dependency-path: go.sum

      - id: versions
        uses: ./.github/actions/load-versions

      # syft so the `sbom`/`submit --image` smoke paths could run; tests
      # themselves skip when it is absent, but keeping it here matches release.
      # SHA-pinned action (not curl|sh from mutable main) for a verifiable install.
      - name: Install syft
        uses: anchore/sbom-action/download-syft@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26  # v0.24.2
        with:
          syft-version: "${{ steps.versions.outputs.syft }}"

      - name: Format check
        run: make fmt-check

      - name: Vet
        run: go vet ./...

      - name: Test + coverage gate
        run: make test-coverage

  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # Full history: the secret scan below reads the whole commit graph. A
      # secret committed and then removed is still published -- the object
      # stays reachable in the history, in every fork, and in every cache --
      # so a shallow clone would make `gitleaks git` scan one commit and
      # report "no leaks found", which is worse than not running it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache-dependency-path: go.sum

      - id: versions
        uses: ./.github/actions/load-versions

      - name: Lint
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a  # v9.3.0
        with:
          version: "${{ steps.versions.outputs.golangci_lint }}"

      - name: actionlint
        run: |
          go install "github.com/rhysd/actionlint/cmd/actionlint@${{ steps.versions.outputs.actionlint }}"
          actionlint

      - name: yamllint
        run: |
          pipx install "yamllint==${{ steps.versions.outputs.yamllint }}"
          yamllint --strict .

      # A missing license header is caught here rather than at review time.
      - name: license headers
        run: make license-check

      - name: secrets
        run: |
          go install "github.com/zricethezav/gitleaks/v8@${{ steps.versions.outputs.gitleaks }}"
          gitleaks dir --no-banner --redact .
          gitleaks git --no-banner --redact .

      - name: go mod tidy is committed
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum

  vuln:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: .go-version
          check-latest: true
          cache-dependency-path: go.sum

      # `make vulncheck` rather than govulncheck directly: the Makefile target
      # holds the pinned version, and running the raw tool here would let CI and
      # the local gate disagree about what "green" means -- which is the one
      # thing the gate exists to prevent.
      - name: govulncheck
        run: make vulncheck

  shell:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # ShellCheck the release/bump tooling. shellcheck is preinstalled on
      # ubuntu-latest. tools/ scripts have no extension; lint them explicitly.
      - name: ShellCheck
        run: shellcheck tools/bump tools/common
