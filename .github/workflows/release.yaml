name: release

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+*'  # semver, optional pre-release suffix (v1.2.3-rc1)

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Re-qualify from scratch on the tagged commit — the release does not assume
  # main was green. Same reusable flow the push/PR `test` workflow runs.
  qualify:
    uses: ./.github/workflows/qualify.yaml
    permissions:
      contents: read

  # Building, signing, attesting and publishing all happen in the shared build
  # definition, which changes two things beyond removing steps from here.
  #
  # It reaches SLSA Build Level 3 rather than 2. goreleaser runs this
  # repository's own hooks, and when the build and the OIDC token share a job --
  # as they did here -- a hook could take the token and mint provenance naming
  # this workflow as the builder for bytes it never produced. release-go.yaml
  # keeps the identity in a job that runs no code from this repository, so
  # Fulcio records thingzio/actions as the signer and this repository as the
  # entry point. Consumers check that with --signer-workflow.
  #
  # It also signs. This workflow produced provenance but no signature; the
  # shared one adds a keyless Sigstore signature over the checksum file, which
  # already commits to every artifact by digest.
  #
  # Pinned by commit SHA, not by tag: a floating tag is a build definition
  # someone can move, which is the mutable-builder problem Level 3 excludes.
  release:
    needs: qualify
    permissions:
      contents: write
      # Granted to the called workflow, not used here. Only its attest job
      # receives it, and that job runs no code from this repository.
      id-token: write
      attestations: write
    uses: thingzio/actions/.github/workflows/release-go.yaml@960a5cffeb70c09b4d9c4522186794cb126518e9  # v1.6.0
    secrets:
      # Both the cask repository token (a contents:write PAT on
      # thingzio/homebrew-tap) and the guard: skip_upload in .goreleaser.yaml is
      # templated on it, so no cross-repo push is attempted until it is set.
      homebrew_deploy_key: ${{ secrets.HOMEBREW_DEPLOY_KEY }}
